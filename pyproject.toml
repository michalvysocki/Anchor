[project]
name = "anchor"
version = "0.1.0"
description = "Grounded predictive path consistency for latent world models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib==3.9.4",
    "numpy==2.0.2",
    "torch==2.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anchor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]
